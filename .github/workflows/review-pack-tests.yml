name: Review Pack Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile review-pack helper
        run: python -m py_compile tools/review-pack/generate_review_pack.py
      - name: Run review-pack tests
        run: python tools/review-pack/test_generate_review_pack.py
